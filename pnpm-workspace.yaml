packages:
  - "apps/*"
  - "packages/*"

minimumReleaseAgeExclude:
  - '@next/env@16.3.0-canary.78'
  - '@next/swc-darwin-arm64@16.3.0-canary.78'
  - '@next/swc-darwin-x64@16.3.0-canary.78'
  - '@next/swc-linux-arm64-gnu@16.3.0-canary.78'
  - '@next/swc-linux-arm64-musl@16.3.0-canary.78'
  - '@next/swc-linux-x64-gnu@16.3.0-canary.78'
  - '@next/swc-linux-x64-musl@16.3.0-canary.78'
  - '@next/swc-win32-arm64-msvc@16.3.0-canary.78'
  - '@next/swc-win32-x64-msvc@16.3.0-canary.78'
  - next@16.3.0-canary.78

# pnpm 11 settings live here (moved from package.json's `pnpm` field).
# Allow these native deps to run their install-time build scripts. pnpm 11
# replaced `onlyBuiltDependencies` with `allowBuilds`; with the old key a
# frozen install exits 1 (ERR_PNPM_IGNORED_BUILDS) and rewrites this file.
allowBuilds:
  esbuild: true
  sharp: true
