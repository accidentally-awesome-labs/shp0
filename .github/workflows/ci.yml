name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # A frozen install must not rewrite tracked files (pnpm 11 rewrites
      # pnpm-workspace.yaml when build approvals are missing).
      - name: Install left the tree clean
        run: git diff --exit-code

      - name: Banned patterns
        run: node scripts/ci/banned-patterns.mjs

      - name: CI script self-tests
        run: node --test 'scripts/ci/*.test.mjs'

      # Pure Operator allowlist policy (Issue #52). Needs no database, unlike
      # the rest of packages/auth/tests, so it runs with the fast checks.
      - name: Auth unit tests
        working-directory: packages/auth
        run: pnpm exec vitest run tests/operator.test.ts

      # Every platform admin server action calls requireOperator() first, and
      # no other apps/web file reaches the Operator-only db helpers (Issue #52).
      - name: Operator guard
        run: node scripts/ci/operator-guard.mjs

      - name: Typecheck
        run: pnpm -r typecheck

      # Pure modules only, no database. The Postgres suites (db and auth) run
      # in the `integration` job below, starting from an empty database.
      - name: Unit tests
        working-directory: packages/db
        run: >-
          pnpm exec vitest run
          tests/money.test.ts
          tests/cart.test.ts
          tests/order.test.ts
          tests/discounts.test.ts
          tests/billing.test.ts
          tests/collections.test.ts
          tests/payments.test.ts
          tests/store-status.test.ts
          tests/domain-verification.test.ts
          tests/hostname.test.ts

      - name: Build
        env:
          # Build-time placeholder so better-auth doesn't log default-secret
          # errors during prerender. Not used at runtime.
          BETTER_AUTH_SECRET: ci-build-placeholder-not-a-secret
        run: pnpm build

  # The Postgres suites (RLS isolation, provisioning, integration, auth), run
  # from an EMPTY database so applySchema() has to bootstrap it from nothing.
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Probe over TCP so the check only passes once the real server is up,
        # not the socket-only server the image runs while initialising.
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The tests connect to postgresql:///shp0_test?user=...; with no host in
      # the URL, node-postgres (and psql) fall back to PGHOST/PGPORT. An IPv4
      # literal, so neither tool depends on how the runner resolves localhost.
      PGHOST: 127.0.0.1
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@v5

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Exactly what the suites expect: the platform role cloud_admin, the
      # tenant role "default" (subject to RLS), neither a superuser, and an
      # empty shp0_test owned by cloud_admin. Owning the database lets
      # cloud_admin create tables in `public` (PG15+); applySchema() runs as
      # cloud_admin, so it owns every table and, as owner (no FORCE RLS),
      # bypasses RLS.
      - name: Provision test database
        run: |
          psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          CREATE ROLE cloud_admin LOGIN NOSUPERUSER;
          CREATE ROLE "default" LOGIN NOSUPERUSER;
          CREATE DATABASE shp0_test OWNER cloud_admin;
          SQL

      # The db suite runs first (its files share the database and run one at a
      # time); the auth suite runs after it, never concurrently.
      - name: Integration tests (db)
        working-directory: packages/db
        run: pnpm exec vitest run

      - name: Integration tests (auth)
        working-directory: packages/auth
        run: pnpm exec vitest run
